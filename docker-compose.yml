services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wms-sqlserver
    environment:
      # SQL Server password. Compose reads it from the .env file next to this file (see .env.example)
      # or from the environment of the host. The same value is passed to the API connection string.
      SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is not set. Create a .env file with MSSQL_SA_PASSWORD=<strong password>, see .env.example}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    volumes:
      - mssql_data_wms:/var/opt/mssql
    networks:
      - wms-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: wms-api
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      # This compose file is the production stack. It refuses to fall back to the demo credentials.
      IsDemoVersion: "false"
      # Signing key for the access tokens. Compose reads it from the .env file next to this file
      # (see .env.example) or from the environment of the host. Start up fails when it is missing.
      Jwt__Key: "${Jwt__Key:?Jwt__Key is not set. Create a .env file with Jwt__Key=<secret>, see .env.example}"
      # Password of the administrator account that is created on the first start up. Start up fails
      # when the stored account still uses the password of an earlier release and this value is missing.
      AspNetIdentity__DefaultAdmin__Email: "${AspNetIdentity__DefaultAdmin__Email:-admin@root.com}"
      AspNetIdentity__DefaultAdmin__Password: "${AspNetIdentity__DefaultAdmin__Password:?AspNetIdentity__DefaultAdmin__Password is not set. Create a .env file with AspNetIdentity__DefaultAdmin__Password=<password of at least 12 characters>, see .env.example}"
      # The connection string contains the SQL Server password, so it is composed here instead of
      # being stored in appsettings.Docker.json.
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=WHMS-LTE-FS;User=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - wms-network
    volumes:
      - app_data_wms:/app/wwwroot/app_data

volumes:
  mssql_data_wms:
  app_data_wms:

networks:
  wms-network:
    driver: bridge